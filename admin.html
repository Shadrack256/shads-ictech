<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · SHADS-ICTECH</title>
<meta name="robots" content="noindex, nofollow" />
<style>
:root{
  --navy:#0A1F44; --navy-2:#12305E; --navy-3:#061530;
  --yellow:#FFC629; --yellow-3:#E0A800;
  --grey-50:#F7F8FA; --grey-100:#EFF1F5; --grey-200:#DDE1E9;
  --grey-500:#7A8497; --grey-700:#3E4859; --white:#fff;
  --radius:12px;
  --shadow:0 8px 28px rgba(10,31,68,.10);
  --shadow-lg:0 20px 50px rgba(10,31,68,.22);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  background:var(--grey-50); color:var(--navy); line-height:1.6;
  min-height:100vh;
}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}

/* ---------- LOGIN ---------- */
.login-screen{
  min-height:100vh;
  display:grid; place-items:center;
  background:var(--navy);
  padding:24px;
  position:relative; overflow:hidden;
}
.login-screen::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(700px 400px at 80% 0%, rgba(255,198,41,.18), transparent 62%);
}
.login-box{
  position:relative; z-index:1;
  width:100%; max-width:400px;
  background:var(--white);
  border-radius:18px;
  padding:40px 34px;
  box-shadow:var(--shadow-lg);
}
.login-logo{ display:flex; align-items:center; gap:11px; margin-bottom:26px; }
.login-logo .mark{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--yellow),var(--yellow-3));
  color:var(--navy); display:grid; place-items:center;
  font-weight:900;font-size:1.2rem;
}
.login-logo strong{ font-size:1.05rem; font-weight:900; letter-spacing:-.02em; }
.login-logo strong span{ color:var(--yellow-3); }
.login-logo small{
  display:block;font-size:.62rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--grey-500);font-weight:700;
}
.login-box h1{ font-size:1.35rem; font-weight:900; margin-bottom:6px; letter-spacing:-.02em; }
.login-box > p{ font-size:.87rem; color:var(--grey-500); margin-bottom:26px; }

.field{ margin-bottom:16px; }
.field label{
  display:block;font-size:.78rem;font-weight:800;
  letter-spacing:.04em;margin-bottom:7px;
}
.field input{
  width:100%; padding:13px 15px;
  border:1.5px solid var(--grey-200);
  border-radius:9px; background:var(--grey-50);
  outline:none; font-size:.92rem;
  transition:border-color .2s, box-shadow .2s, background .2s;
}
.field input:focus{
  border-color:var(--navy); background:var(--white);
  box-shadow:0 0 0 4px rgba(10,31,68,.09);
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 22px; border-radius:999px;
  font-weight:800; font-size:.9rem;
  border:2px solid transparent; cursor:pointer;
  transition:transform .18s, box-shadow .18s, background .18s, color .18s, border-color .18s;
}
.btn:hover{ transform:translateY(-2px); }
.btn:disabled{ opacity:.6; cursor:not-allowed; transform:none; }
.btn--primary{ background:var(--yellow); color:var(--navy); box-shadow:0 8px 20px rgba(255,198,41,.34); }
.btn--primary:hover{ background:#FFD75E; }
.btn--navy{ background:var(--navy); color:var(--white); }
.btn--navy:hover{ background:var(--navy-2); }
.btn--ghost{ background:transparent; border-color:var(--grey-200); color:var(--navy); }
.btn--ghost:hover{ border-color:var(--navy); }
.btn--sm{ padding:8px 16px; font-size:.8rem; }
.btn--block{ width:100%; }

.msg{
  display:none; padding:12px 14px; border-radius:9px;
  font-size:.85rem; font-weight:600; margin-bottom:16px;
}
.msg.show{ display:block; }
.msg--err{ background:#FDECEC; color:#A62B2B; border:1px solid #F5C6C6; }

/* ---------- DASHBOARD ---------- */
.dash{ display:none; min-height:100vh; flex-direction:column; }
.dash.show{ display:flex; }

.topbar{
  background:var(--navy); color:var(--white);
  padding:0 22px; height:68px;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px; position:sticky; top:0; z-index:50;
  box-shadow:0 4px 18px rgba(6,21,48,.32);
}
.topbar .brand{ display:flex; align-items:center; gap:11px; }
.topbar .mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--yellow),var(--yellow-3));
  color:var(--navy); display:grid; place-items:center;
  font-weight:900;font-size:1.08rem;
}
.topbar strong{ font-size:1rem; font-weight:900; letter-spacing:-.02em; }
.topbar strong span{ color:var(--yellow); }
.topbar small{ display:block; font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.55); font-weight:700; }
.topbar-actions{ display:flex; align-items:center; gap:12px; }
.topbar .who{ font-size:.82rem; color:rgba(255,255,255,.7); }

.container{ max-width:1240px; width:100%; margin:0 auto; padding:32px 22px 60px; flex:1; }

.page-head{ margin-bottom:26px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.page-head h1{ font-size:1.6rem; font-weight:900; letter-spacing:-.02em; }
.page-head p{ font-size:.88rem; color:var(--grey-500); }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
.stat{
  background:var(--white); border:1px solid var(--grey-200);
  border-radius:var(--radius); padding:20px 22px;
  box-shadow:var(--shadow);
}
.stat strong{ display:block; font-size:1.85rem; font-weight:900; letter-spacing:-.03em; line-height:1.1; }
.stat span{ font-size:.74rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--grey-500); }
.stat--yellow strong{ color:var(--yellow-3); }

.toolbar{ display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
.toolbar input, .toolbar select{
  padding:11px 14px; border:1.5px solid var(--grey-200);
  border-radius:9px; background:var(--white); outline:none; font-size:.88rem;
  transition:border-color .2s, box-shadow .2s;
}
.toolbar input{ flex:1; min-width:200px; }
.toolbar input:focus, .toolbar select:focus{
  border-color:var(--navy); box-shadow:0 0 0 4px rgba(10,31,68,.08);
}

.table-wrap{
  background:var(--white); border:1px solid var(--grey-200);
  border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
}
table{ width:100%; border-collapse:collapse; font-size:.87rem; }
thead th{
  text-align:left; padding:14px 18px;
  background:var(--grey-50); border-bottom:1px solid var(--grey-200);
  font-size:.72rem; font-weight:900; letter-spacing:.1em;
  text-transform:uppercase; color:var(--grey-700);
  white-space:nowrap;
}
tbody td{ padding:16px 18px; border-bottom:1px solid var(--grey-100); vertical-align:top; }
tbody tr:last-child td{ border-bottom:0; }
tbody tr:hover{ background:var(--grey-50); }
td .name{ font-weight:800; }
td .contact{ font-size:.8rem; color:var(--grey-500); }
td .contact a{ color:var(--navy); font-weight:700; }
td .contact a:hover{ color:var(--yellow-3); }
td .msg-body{ max-width:340px; color:var(--grey-700); font-size:.85rem; }

.pill{
  display:inline-block; padding:4px 11px; border-radius:999px;
  font-size:.68rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase;
}
.pill--new{ background:rgba(255,198,41,.22); color:#8A6400; }
.pill--contacted{ background:#E3EEFB; color:#1B4F8A; }
.pill--won{ background:#E8F6EE; color:#1B6B3A; }
.pill--lost{ background:#F2F3F5; color:#6B7280; }

.row-actions{ display:flex; gap:7px; flex-wrap:wrap; }
.row-actions button{
  padding:6px 11px; border-radius:7px;
  font-size:.74rem; font-weight:800;
  border:1px solid var(--grey-200); background:var(--white);
  cursor:pointer; transition:background .18s, color .18s, border-color .18s;
}
.row-actions button:hover{ background:var(--navy); color:var(--white); border-color:var(--navy); }
.row-actions button.danger:hover{ background:#C0392B; border-color:#C0392B; }

.empty{ padding:60px 24px; text-align:center; color:var(--grey-500); }
.empty strong{ display:block; font-size:1.05rem; color:var(--navy); margin-bottom:6px; }

.loading{ padding:50px; text-align:center; color:var(--grey-500); }
.spinner{
  width:26px;height:26px;margin:0 auto 14px;
  border:3px solid var(--grey-200); border-top-color:var(--navy);
  border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

@media (max-width:900px){
  .stats{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:760px){
  .table-wrap{ overflow-x:auto; }
  table{ min-width:820px; }
  .topbar .who{ display:none; }
}
@media (max-width:480px){
  .stats{ grid-template-columns:1fr; }
  .container{ padding:22px 14px 50px; }
}
</style>
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <span class="mark">S</span>
      <span>
        <strong>SHADS<span>-ICTECH</span></strong>
        <small>Admin Panel</small>
      </span>
    </div>

    <h1>Sign in</h1>
    <p>Enter your admin credentials to view client enquiries.</p>

    <div class="msg msg--err" id="loginErr"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@shads-ictech.com" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn--primary btn--block" id="loginBtn">Sign In</button>
    </form>
  </div>
</div>

<!-- ============================ DASHBOARD ============================ -->
<div class="dash" id="dashboard">

  <header class="topbar">
    <div class="brand">
      <span class="mark">S</span>
      <span>
        <strong>SHADS<span>-ICTECH</span></strong>
        <small>Admin Panel</small>
      </span>
    </div>
    <div class="topbar-actions">
      <span class="who" id="whoami"></span>
      <button class="btn btn--primary btn--sm" id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <div class="container">

    <div class="page-head">
      <div>
        <h1>Client Enquiries</h1>
        <p>Every submission from the website contact form.</p>
      </div>
      <button class="btn btn--ghost btn--sm" id="refreshBtn">↻ Refresh</button>
    </div>

    <div class="stats">
      <div class="stat"><strong id="statTotal">0</strong><span>Total Leads</span></div>
      <div class="stat stat--yellow"><strong id="statNew">0</strong><span>New</span></div>
      <div class="stat"><strong id="statWon">0</strong><span>Won</span></div>
      <div class="stat"><strong id="statWeek">0</strong><span>Last 7 Days</span></div>
    </div>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search by name, phone, email or message…" />
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="won">Won</option>
        <option value="lost">Lost</option>
      </select>
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="loading"><div class="spinner"></div>Loading enquiries…</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ==========================================================
   SHADS-ICTECH — Admin Panel Logic
   Supabase credentials are already configured below.
   ========================================================== */
const SUPABASE_URL      = "https://dbhlbifxejffhlkudlxr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiaGxiaWZ4ZWpmZmhsa3VkbHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MjI5MDMsImV4cCI6MjEwNzQ5ODkwM30.N8X5niR1rxeIa8lJnJCdjJM2il21bRlUTvMoaGh8LoM";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- Element refs ---------- */
const loginScreen = document.getElementById("loginScreen");
const dashboard   = document.getElementById("dashboard");
const loginForm   = document.getElementById("loginForm");
const loginBtn    = document.getElementById("loginBtn");
const loginErr    = document.getElementById("loginErr");
const logoutBtn   = document.getElementById("logoutBtn");
const whoami      = document.getElementById("whoami");
const tableWrap   = document.getElementById("tableWrap");
const refreshBtn  = document.getElementById("refreshBtn");
const searchInput = document.getElementById("searchInput");
const statusFilter= document.getElementById("statusFilter");

let allLeads = [];

/* ---------- Helpers ---------- */
function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("en-GB", {
    day:"2-digit", month:"short", year:"numeric",
    hour:"2-digit", minute:"2-digit"
  });
}
function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}

/* ---------- Auth ---------- */
async function init() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) showDashboard(session.user);
  else showLogin();
}

function showLogin() {
  loginScreen.style.display = "grid";
  dashboard.classList.remove("show");
}
function showDashboard(user) {
  loginScreen.style.display = "none";
  dashboard.classList.add("show");
  whoami.textContent = user?.email || "";
  loadLeads();
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginErr.classList.remove("show");
  loginBtn.disabled = true;
  loginBtn.textContent = "Signing in…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  loginBtn.disabled = false;
  loginBtn.textContent = "Sign In";

  if (error) {
    loginErr.textContent = error.message || "Sign in failed. Check your email and password.";
    loginErr.classList.add("show");
    return;
  }

  loginForm.reset();
  showDashboard(data.user);
});

logoutBtn.addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  allLeads = [];
  showLogin();
});

/* ---------- Load leads ---------- */
async function loadLeads() {
  tableWrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading enquiries…</div>';

  const { data, error } = await supabaseClient
    .from("leads")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    tableWrap.innerHTML =
      '<div class="empty"><strong>Could not load enquiries</strong>' + esc(error.message) + "</div>";
    return;
  }

  allLeads = data || [];
  updateStats();
  renderTable();
}

refreshBtn.addEventListener("click", loadLeads);

/* ---------- Stats ---------- */
function updateStats() {
  const now = Date.now();
  const week = 7 * 24 * 60 * 60 * 1000;

  document.getElementById("statTotal").textContent = allLeads.length;
  document.getElementById("statNew").textContent =
    allLeads.filter(l => l.status === "new").length;
  document.getElementById("statWon").textContent =
    allLeads.filter(l => l.status === "won").length;
  document.getElementById("statWeek").textContent =
    allLeads.filter(l => now - new Date(l.created_at).getTime() < week).length;
}

/* ---------- Render table ---------- */
function renderTable() {
  const q = searchInput.value.trim().toLowerCase();
  const status = statusFilter.value;

  let rows = allLeads;
  if (status) rows = rows.filter(l => l.status === status);
  if (q) {
    rows = rows.filter(l =>
      [l.full_name, l.phone, l.email, l.service, l.message, l.budget]
        .filter(Boolean).join(" ").toLowerCase().includes(q)
    );
  }

  if (!rows.length) {
    tableWrap.innerHTML =
      '<div class="empty"><strong>No enquiries found</strong>' +
      (allLeads.length ? "Try changing your search or filter." : "New website submissions will appear here.") +
      "</div>";
    return;
  }

  tableWrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Received</th>
          <th>Client</th>
          <th>Service</th>
          <th>Message</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(l => `
          <tr data-id="${esc(l.id)}">
            <td>
              <div class="name">${esc(fmtDate(l.created_at))}</div>
              <div class="contact">${esc(timeAgo(l.created_at))}</div>
            </td>
            <td>
              <div class="name">${esc(l.full_name)}</div>
              <div class="contact">
                <a href="tel:${esc(l.phone)}">${esc(l.phone)}</a>
                ${l.email ? `<br><a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : ""}
              </div>
            </td>
            <td>
              <div class="name">${esc(l.service || "—")}</div>
              <div class="contact">${esc(l.budget || "")}</div>
            </td>
            <td><div class="msg-body">${esc(l.message)}</div></td>
            <td><span class="pill pill--${esc(l.status)}">${esc(l.status)}</span></td>
            <td>
              <div class="row-actions">
                <button data-act="contacted">Contacted</button>
                <button data-act="won">Won</button>
                <button data-act="lost">Lost</button>
                <button data-act="delete" class="danger">Delete</button>
              </div>
            </td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

  tableWrap.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", handleAction);
  });
}

searchInput.addEventListener("input", renderTable);
statusFilter.addEventListener("change", renderTable);

/* ---------- Row actions ---------- */
async function handleAction(e) {
  const btn  = e.currentTarget;
  const id   = btn.closest("tr").dataset.id;
  const act  = btn.dataset.act;

  if (act === "delete") {
    if (!confirm("Delete this enquiry permanently?")) return;
    const { error } = await supabaseClient.from("leads").delete().eq("id", id);
    if (error) return alert("Delete failed: " + error.message);
    allLeads = allLeads.filter(l => l.id !== id);
  } else {
    const { error } = await supabaseClient.from("leads").update({ status: act }).eq("id", id);
    if (error) return alert("Update failed: " + error.message);
    const lead = allLeads.find(l => l.id === id);
    if (lead) lead.status = act;
  }

  updateStats();
  renderTable();
}

/* ---------- Boot ---------- */
init();

supabaseClient.auth.onAuthStateChange((_event, session) => {
  if (session) showDashboard(session.user);
  else showLogin();
});
</script>

</body>
</html>
